<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TM7NLQ9HVG"></script>

  function gtag(){dataLayer.push(arguments);}

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天氣旅圖</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
<style>
  /* 介面只用黑白灰；紅黃綠只留給降雨機率，藍色只留給「偏冷」。 */
  :root {
    --ink: #1f2328; --ink-2: #57606a; --line: #8c959f; --hair: #d0d7de; --bg: #fff; --bg-2: #f2f4f5;
    /* 浮在地圖上的面板：底色跟淡色底圖的陸地同一個色，用陰影跟地圖分開，不用框線 */
    --surface: #fbfbfa;
    --float: 0 1px 2px rgb(31 35 40 / .08), 0 6px 20px -6px rgb(31 35 40 / .18);
    /* 降雨顏色：意義和門檻不能改。黃最亮、綠居中、紅最深，色盲也能靠深淺分。 */
    --rain-green: #2fa866; --rain-yellow: #f2c230; --rain-red: #b3261e;
    --cold: #1f5fbf;
    --dot: 14px;      /* 標記看起來的大小，地圖放大時由程式調大 */
    --sheet-h: 0px;   /* 手機底部景點資訊的高度，打開時由程式填 */
  }
  html, body { margin: 0; height: 100%; color: var(--ink);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }
  /* 底圖：國土測繪中心「臺灣通用電子地圖」。全台只有縣市名、放大才有鄉鎮名，沒有小路小地名，地名是中文。
     保留顏色但彩度壓低、整體調亮（深海也跟著變淡），地圖退到後面，景點的紅黃綠才是畫面主角。
     底色跟調淡後的海同色，圖還沒載入時不會閃一塊別的顏色。 */
  #map { position: absolute; inset: 0; background: #d3e0ec; }
  .leaflet-tile-pane { filter: saturate(.4) brightness(1.16) contrast(.82); }
  .leaflet-container { font: inherit; }
  /* 手機底部的景點資訊打開時，縮放鈕和出處標示往上讓，不被蓋住 */
  .leaflet-bottom { bottom: var(--sheet-h); }
  /* 縮放鈕放大到好點的大小 */
  .leaflet-bar a, .leaflet-touch .leaflet-bar a { width: 44px; height: 44px; line-height: 44px; background: var(--surface); color: var(--ink); }
  .leaflet-touch .leaflet-bar, .leaflet-bar { border: 0; box-shadow: var(--float); border-radius: 10px; overflow: hidden; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); box-shadow: var(--float); }
  .leaflet-popup-content-wrapper { border-radius: 12px; }
  .leaflet-container .leaflet-control-attribution { background: rgb(251 251 250 / .85); color: var(--ink-2); }

  .panel {
    position: absolute; top: 10px; left: 10px; z-index: 1000; width: 300px; box-sizing: border-box;
    background: var(--surface); border-radius: 12px; box-shadow: var(--float);
    padding: 12px; font-size: 14px;
    /* 篩選面板打開時內容比畫面高：面板自己捲動，不超出畫面 */
    max-height: calc(100% - 20px); overflow-y: auto;
  }
  .panel h1 { font-size: 16px; margin: 0 0 10px; }
  .days { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .days button {
    flex: 1; min-height: 44px; border: 0; border-left: 1px solid var(--line); background: var(--bg);
    color: var(--ink); font: inherit; cursor: pointer; padding: 0 4px;
  }
  .days button:first-child { border-left: 0; }
  .days button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .days button:focus-visible, .more summary:focus-visible, .sheet button:focus-visible, .trip select:focus-visible, .trip button:focus-visible { outline: 3px solid var(--cold); outline-offset: -3px; }
  /* 出發地和車程：桌機兩列（有標籤），手機擠成一列（標籤收掉，選單第一格自己會講） */
  .trip { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px; align-items: center; margin-top: 8px; }
  .trip .lab { color: var(--ink-2); font-size: 13px; }
  .trip select {
    min-width: 0; min-height: 44px; padding: 0 6px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); font: inherit;
  }
  .trip select:disabled { color: var(--line); border-color: var(--hair); }
  .trip #useLocation {
    min-height: 44px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); font: inherit; cursor: pointer;
  }
  .trip #useLocation:disabled { color: var(--ink-2); cursor: progress; }
  .summary { margin: 10px 0 8px; font-weight: 600; }
  .notice { margin: 0 0 8px; padding: 8px 10px; border: 1px solid var(--ink); border-radius: 6px; background: var(--bg-2); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 13px; color: var(--ink-2); }
  .legend .title { flex-basis: 100%; }
  .legend span { display: inline-flex; align-items: center; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 5px; border: 1.5px solid var(--ink); box-sizing: border-box; flex: none; }
  .sq { border-radius: 2px; }
  .ring { background: var(--bg); border-color: var(--cold); border-width: 2.5px; }
  .more { margin-top: 6px; border-top: 1px solid var(--hair); }
  .more summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--ink-2); font-size: 13px; }
  .more label { display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; }
  .more input { width: 18px; height: 18px; margin: 0; flex: none; }
  .note { color: var(--ink-2); font-size: 13px; margin: 6px 0 0; }
  /* 篩選面板：手機上預設收起來 */
  .filters { margin-top: 6px; border-top: 1px solid var(--hair); }
  .filters summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-size: 14px; font-weight: 600; }
  .filters summary:focus-visible { outline: 3px solid var(--cold); outline-offset: -3px; }
  .filters .group { color: var(--ink-2); font-size: 13px; margin: 6px 0 0; }
  .filters .opts { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8px; }
  .filters label { display: flex; align-items: center; gap: 6px; min-height: 36px; cursor: pointer; font-size: 13px; }
  .filters input { width: 18px; height: 18px; margin: 0; flex: none; }
  .filters .wide { grid-column: 1 / -1; }

  /* 標記：點擊範圍 32px，看起來是中間那顆小圓點 */
  .spot { display: flex; align-items: center; justify-content: center; }
  /* 白邊加淡陰影：底圖有顏色（綠色山區、藍色的海），景點要浮在上面，邊緣才切得開 */
  .marker { width: var(--dot); height: var(--dot); border: 1.5px solid var(--ink); border-radius: 50%; box-sizing: border-box;
    box-shadow: 0 0 0 2px #fff, 0 1px 4px 1px rgb(31 35 40 / .35); }
  .marker.indoor { border-radius: 2px; }
  .marker.cold { outline: 2px solid var(--cold); outline-offset: 1px; }
  .marker.sel { box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--ink), 0 2px 8px 4px rgb(31 35 40 / .3); }
  .c-green { background: var(--rain-green); } .c-yellow { background: var(--rain-yellow); } .c-red { background: var(--rain-red); }
  /* 沒資料是空心的，跟「有資料」一眼分開 */
  .c-gray { background: var(--bg); border-color: var(--line); }
  /* 太近的景點合併成一個點：裡面寫有幾個，顏色跟代表的那個景點一樣 */
  .cluster { min-width: 26px; height: 26px; padding: 0 5px; border: 1.5px solid var(--ink); border-radius: 13px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--ink);
    box-shadow: 0 0 0 2px #fff, 0 1px 4px 1px rgb(31 35 40 / .35); }
  .cluster.c-red { color: #fff; }

  /* 景點資訊：桌機放在地圖的資訊框裡，手機放在底部滑出的面板裡，內容一樣 */
  .detail { font-size: 14px; line-height: 1.5; min-width: 220px; }
  .detail .name { font-size: 16px; font-weight: 600; }
  /* 縮圖：寬度固定，照片載不到就換成類型的圖示 */
  .detail .thumb { display: block; width: 260px; max-width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; background: var(--bg-2); }
  .detail .thumb-icon { width: 260px; max-width: 100%; height: 72px; border-radius: 8px; margin-bottom: 8px; background: var(--bg-2);
    display: flex; align-items: center; justify-content: center; font-size: 34px; }
  .detail .excerpt { margin: 4px 0 6px; font-size: 13px; }
  .detail .tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  .detail .tags span { font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--bg-2); color: var(--ink-2); }
  .detail .site { color: var(--ink); font-size: 13px; }
  .detail .verdict { display: flex; align-items: center; margin: 2px 0; }
  .detail .when, .detail .meta { color: var(--ink-2); font-size: 13px; }
  .detail .slots { display: flex; gap: 6px; margin: 8px 0; text-align: center; }
  .detail .slots div { flex: 1; background: var(--bg-2); border-radius: 6px; padding: 5px 0; }
  .detail .slots span { display: block; color: var(--ink-2); font-size: 12px; }
  .detail .is-cold { color: var(--cold); font-weight: 600; }
  .detail .meta { margin-top: 6px; }
  .detail .route {
    display: flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 10px;
    border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font-weight: 600; text-decoration: none;
  }
  .detail .route:hover { background: var(--bg-2); }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1001; box-sizing: border-box;
    background: var(--surface); border-radius: 14px 14px 0 0;
    box-shadow: 0 -1px 2px rgb(31 35 40 / .06), 0 -8px 24px -8px rgb(31 35 40 / .18);
    padding: 12px 56px 16px 14px;
  }
  .sheet button {
    position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border: 0; background: none;
    font-size: 22px; line-height: 1; color: var(--ink-2); cursor: pointer;
  }

  /* 手機：面板變成貼齊上緣的一條，只留日期、摘要、一行圖例；其他收進「圖例說明與設定」 */
  @media (max-width: 599px) {
    .panel { top: 0; left: 0; right: 0; width: auto; border-radius: 0 0 12px 12px; padding: 8px 10px 4px; max-height: 75%; }
    .panel h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .summary { margin: 8px 0 6px; }
    .trip { grid-template-columns: 1fr 1fr 1fr; margin-top: 6px; }
    .trip .lab { display: none; }
    .trip #useLocation { grid-column: 1 / -1; }
    /* 16px 以下 iPhone 點選單時會自動放大整個畫面 */
    .trip select, .trip #useLocation { font-size: 16px; padding: 0 4px; }
  }
</style>
</head>
<body>
<div class="panel">
  <h1>天氣旅圖</h1>
  <div class="days" id="days" role="group" aria-label="選擇日期"></div>
  <div class="trip" id="trip" hidden>
    <span class="lab">出發地</span>
    <select id="originCounty" aria-label="出發的縣市"></select>
    <select id="originTown" aria-label="出發的鄉鎮市區" disabled></select>
    <span class="lab">車程</span>
    <select id="driveLimit" aria-label="車程上限" disabled></select>
    <button type="button" id="useLocation" hidden>📍 用我的位置</button>
  </div>
  <p class="note" id="locateNote" role="status" hidden></p>
  <p class="summary" id="summary" aria-live="polite"></p>
  <p class="note" id="driveNote" hidden></p>
  <p class="notice" id="notice" role="status" hidden></p>
  <div class="legend">
    <span class="title">白天最高降雨機率（09:00–18:00）</span>
    <span><i class="dot c-green"></i>20% 以下</span>
    <span><i class="dot c-yellow"></i>30–50%</span>
    <span><i class="dot c-red"></i>60% 以上</span>
    <span id="legendGray"><i class="dot c-gray"></i>沒資料</span>
  </div>
  <details class="more" id="more">
    <summary>圖例說明與設定</summary>
    <div class="legend">
      <span><i class="dot ring"></i>藍框＝偏冷（體感 12°C 以下）</span>
      <span><i class="dot sq c-gray"></i>方形＝室內</span>
    </div>
    <p class="note" id="info"></p>
    <p class="note">天氣資料來源：交通部中央氣象署</p>
    <p class="note">景點資料與照片來源：交通部觀光署</p>
  </details>
  <details class="filters" id="filters">
    <summary id="filtersTitle">篩選景點</summary>
    <p class="group">類型</p>
    <div class="opts" id="typeFilters"></div>
    <p class="group">天氣適配</p>
    <div class="opts" id="fitFilters"></div>
    <div class="opts">
      <label class="wide"><input type="checkbox" id="onlyGood"> 只看好天氣（選定那天是綠色的）</label>
      <label class="wide"><input type="checkbox" id="hideIndoor"> 只看戶外景點（隱藏室內、商圈、夜市、老街）</label>
    </div>
  </details>
</div>
<div id="map" role="region" aria-label="台灣景點地圖"></div>
<div class="sheet" id="sheet" hidden>
  <button type="button" id="sheetClose" aria-label="關閉景點資訊">×</button>
  <div id="sheetBody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous"></script>
<!-- 由 scripts/build-data.js 產出；直接雙擊打開網頁時用這份（瀏覽器不讓 file:// 用 fetch） -->
<script src="public/forecast.js"></script>
<script src="public/attractions.js"></script>
<script src="lib/spot-join.js"></script>
<script src="lib/day-labels.js"></script>
<script src="lib/spot-view.js"></script>
<script src="lib/map-layers.js"></script>
<!-- 事先算好的車程（scripts/build-drive-times.js 產出）。這裡只載入選單要用的索引，各縣市的車程選了出發地才載入 -->
<script src="drive/index.js"></script>
<script src="lib/drive-time.js"></script>
<script>
(async function () {
  // 依縮放選層、畫面上限、合併距離的設定值（lib/map-layers.js）；window.MAP_CONFIG 可以換掉（測試用）
  const CFG = Object.assign({}, MapLayers.DEFAULTS, window.MAP_CONFIG || {});
  // 綠色疊最上面：使用者要找的是綠色，不能被紅點蓋住
  const Z_ORDER = { green: 300, yellow: 200, red: 100, gray: 0 };
  const $ = (id) => document.getElementById(id);
  // 599px 要跟上面 CSS 的 @media 一樣
  const mq = window.matchMedia('(max-width: 599px)');
  const narrow = () => mq.matches;

  function notice(text) {
    $('notice').textContent = text;
    $('notice').hidden = !text;
  }

  let data = window.FORECAST_DATA;
  let attractions = window.ATTRACTIONS_DATA;
  try {
    if (!data) data = await fetch('public/forecast.json').then((r) => r.json());
    if (!attractions) attractions = await fetch('public/attractions.json').then((r) => r.json());
  } catch (e) {
    notice('預報資料暫時讀不到，請稍後重新整理。');
    return;
  }
  // 預報按鄉鎮存，景點自己記鄉鎮：接起來。四層都接，要畫哪幾層照縮放決定。
  data = SpotJoin.join(data, attractions, 4);

  // 桌機先把「圖例說明與設定」打開；手機收著，地圖才看得到
  $('more').open = !narrow();

  // 先給一個大概的全台視角：要畫哪些點得先知道畫面範圍；最後面再用 fitBounds 對準
  const map = L.map('map', { zoomControl: false, zoomSnap: 0.25, center: [23.7, 120.9], zoom: 7.5 });
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  // 政府資料開放授權，免金鑰、免費。車程和部分景點座標來自 OpenStreetMap，出處照樣標示。
  L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', {
    maxZoom: 18,
    attribution: '地圖 &copy; 內政部國土測繪中心 | 車程與景點座標 &copy; OpenStreetMap contributors | 景點 &copy; 交通部觀光署',
  }).addTo(map);

  // 「今天」用打開網頁時的台灣日期算；假資料沒有真的日期，用它的第一天當今天
  const nowTaipei = DayLabels.taipeiDate(Date.now());
  const today = data.source === 'fixture' ? data.days[0] : nowTaipei;
  let dayIndex = DayLabels.defaultIndex(data.days, today);
  let selected = null;     // 目前打開資訊的景點；切換日期時留著，方便比較同一個景點
  let reopening = false;   // 程式自己換資訊框內容時，不要當成使用者關掉
  const layer = L.layerGroup().addTo(map);

  // 篩選面板：九類、三種天氣適配預設全勾
  function checkboxes(containerId, names) {
    return names.map((name) => {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = true;
      input.value = name;
      input.onchange = () => render();
      label.appendChild(input);
      const text = document.createElement('span');
      text.textContent = (containerId === 'typeFilters' ? MapLayers.typeIcon(name) + ' ' : '') + name;
      label.appendChild(text);
      $(containerId).appendChild(label);
      return input;
    });
  }
  const typeBoxes = checkboxes('typeFilters', MapLayers.TYPES);
  const fitBoxes = checkboxes('fitFilters', MapLayers.FITS);
  const filterState = () => ({
    types: typeBoxes.filter((b) => b.checked).map((b) => b.value),
    fits: fitBoxes.filter((b) => b.checked).map((b) => b.value),
    onlyGood: $('onlyGood').checked,
    hideIndoor: $('hideIndoor').checked,
  });

  // 景點的照片、描述、網站在 public/attraction-details.js，第一次點開景點才載入（景點檔太大，拆開）
  // 只載一次：載不到（或檔案壞掉、沒有資料）就算了，資訊框照樣有天氣，只是沒有照片、描述
  let detailsState = 'none'; // none → loading → done
  function loadDetails() {
    if (window.ATTRACTION_DETAILS || detailsState !== 'none') return;
    detailsState = 'loading';
    const el = document.createElement('script');
    el.src = 'public/attraction-details.js';
    const done = () => {
      detailsState = 'done';
      if (selected && window.ATTRACTION_DETAILS) showDetail(); // 資料到了，把照片、描述補上
    };
    el.onload = done;
    el.onerror = done;
    document.head.appendChild(el);
  }
  const detailOf = (s) => (window.ATTRACTION_DETAILS && window.ATTRACTION_DETAILS[s.id]) || s;

  // 出發地和車程。車程檔還沒產出或載入失敗時 driveIndex 是 null，這一列就不顯示。
  const driveIndex = window.DRIVE_INDEX || null;
  let origin = null;       // { county, town }；還沒選是 null
  let minutesTo = null;    // 查「目前出發地到某個景點要幾分鐘」的函式
  let driveLimit = null;   // 車程上限（分鐘）；null 是不限
  let driveFailed = false; // 選了出發地但車程檔讀不到

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // 官方網站只接受 http、https（資料來自政府開放資料，不讓 javascript: 之類的網址變成連結）
  const safeUrl = (u) => (/^https?:\/\//i.test(String(u ?? '').trim()) ? String(u).trim() : '');
  const fmtPop = (v) => (v === null || v === undefined ? '—' : v + '%');
  const hour = (t) => String(t).replace(/^0?(\d+):00$/, '$1'); // 09:00 → 9
  const dayOf = (s) => (s.forecast ? s.forecast[dayIndex] : null);

  // 景點資訊：先講結論，再講各時段，最後才是景點本身的資料
  function detailHtml(s, day) {
    const color = SpotView.colorOf(s, dayIndex);
    const more = detailOf(s);
    const types = s.types && s.types.length ? s.types : [];
    const icon = esc(MapLayers.typeIcon(types[0]));
    // 縮圖直接連觀光署的照片網址；載不到就藏起來，換成類型的圖示
    let html = '<div class="detail">' + (more.image && more.image.url
      ? `<img class="thumb" src="${esc(more.image.url)}" alt="${esc(more.image.name || s.name)}" width="260" height="150" loading="lazy" referrerpolicy="no-referrer"` +
        ` onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="thumb-icon" hidden aria-hidden="true">${icon}</div>`
      : `<div class="thumb-icon" aria-hidden="true">${icon}</div>`) +
      `<div class="name">${esc(s.name)}${s.setting === '室內' ? '（室內）' : ''}</div>` +
      `<div class="verdict"><i class="dot c-${color}"></i>${esc(SpotView.verdict(day))}</div>`;
    if (!day) {
      html += '<div class="when">這個景點對不到鄉鎮預報。</div>';
    } else {
      const name = DayLabels.dayName(day.date, today);
      html += `<div class="when">${esc(name)}${day.partial ? '（剩下的時段）' : ''} ${esc(SpotView.dateText(day.date))}` +
        `${day.partial ? '' : ' 09:00–18:00'}</div>`;
      if (day.coverUntil) {
        html += `<div class="when">預報只到 ${esc(day.coverUntil)}，之後的時段還沒有預報，這天先不標顏色。</div>`;
      }
      html += day.slots.length
        ? '<div class="slots">' + day.slots.map((x) =>
          `<div><span>${esc(hour(x.start))}–${esc(hour(x.end))} 點</span>${fmtPop(x.pop)}</div>`).join('') + '</div>'
        : '<div class="when">這天這個時段沒有預報資料。</div>';
      html += `<div class="${day.cold ? 'is-cold' : ''}">最低體感 ${day.minAT === null ? '—' : esc(day.minAT) + '°C'}` +
        `${day.cold ? ' · 偏冷' : ''}</div>`;
    }
    const minutes = origin ? minutesTo(s.county, s.name) : undefined;
    if (minutes !== undefined) html += `<div class="when">${esc(DriveTime.durationText(origin.county + origin.town, minutes))}</div>`;
    if (more.excerpt) html += `<div class="excerpt">${esc(more.excerpt)}</div>`;
    const tags = [...types, s.weatherFit].filter(Boolean);
    if (tags.length) html += '<div class="tags">' + tags.map((t) => `<span>${esc(t)}</span>`).join('') + '</div>';
    // 2025 遊客人次只有第 1 層（原本的熱門景點）有
    const meta = [esc(s.county) + esc(s.town), s.setting ? esc(s.setting) : '',
      s.layer === 1 && s.visitors !== undefined ? `2025 遊客 ${Number(s.visitors).toLocaleString('zh-TW')} 人次` : ''].filter(Boolean);
    html += `<div class="meta">${meta.join(' · ')}</div>`;
    const site = safeUrl(more.website);
    if (site) html += `<a class="site" href="${esc(site)}" target="_blank" rel="noopener">官方網站</a>`;
    return html + `<a class="route" href="${esc(SpotView.routeUrl(s))}" target="_blank" rel="noopener">用 Google 地圖規劃路線</a></div>`;
  }

  function closeSheet() {
    $('sheet').hidden = true;
    document.documentElement.style.setProperty('--sheet-h', '0px');
  }

  // 手機用底部面板（不會被上面的面板蓋住），桌機用地圖的資訊框
  function showDetail() {
    if (!selected) return;
    loadDetails();
    const html = detailHtml(selected, dayOf(selected));
    const at = [selected.lat, selected.lng];
    reopening = true;
    if (narrow()) {
      map.closePopup();
      $('sheetBody').innerHTML = html;
      $('sheet').hidden = false;
      const h = $('sheet').offsetHeight;
      document.documentElement.style.setProperty('--sheet-h', h + 'px');
      map.panInside(at, { paddingTopLeft: [24, $('days').parentNode.offsetHeight + 24], paddingBottomRight: [24, h + 24] });
    } else {
      closeSheet();
      L.popup({ maxWidth: 300, autoPanPaddingTopLeft: [$('days').parentNode.offsetWidth + 24, 16] })
        .setLatLng(at).setContent(html).openOn(map);
    }
    reopening = false;
  }

  function unselect() {
    if (reopening || !selected) return;
    selected = null;
    render();
  }

  // 合併的點：點了拉近到這幾個景點的範圍；已經拉到最近還疊在一起，就不再合併（見 place 的 clusterPx）
  function zoomInto(members) {
    const lats = members.map((m) => m.lat);
    const lngs = members.map((m) => m.lng);
    map.fitBounds([[Math.min(...lats), Math.min(...lngs)], [Math.max(...lats), Math.max(...lngs)]],
      { padding: [48, 48], maxZoom: map.getMaxZoom() });
  }

  function render() {
    layer.clearLayers();
    const filters = filterState();
    const active = MapLayers.filtersActive(filters);
    $('filtersTitle').textContent = active ? '篩選景點（已篩選）' : '篩選景點';
    // 依縮放決定畫到第幾層；有打開篩選時放寬一級
    const zoom = map.getZoom();
    const maxLayer = MapLayers.maxLayer(zoom, active, CFG);
    const candidates = data.spots.filter((s) => s.layer <= maxLayer);
    const shown = MapLayers.applyFilters(candidates, filters, SpotView.colorOf, dayIndex);
    // 選了出發地又選了車程上限，才用車程篩；到不了的景點（例如離島）這時也拿掉。
    // 車程只算了第 1 層的熱門景點，其他層這時沒有車程，先不顯示。
    const drive = origin && driveLimit !== null ? DriveTime.apply(shown, minutesTo, driveLimit) : null;
    const visible = drive ? drive.visible : shown;
    // 目前打開資訊的景點被篩掉了，資訊也一起收起來
    if (selected && !visible.includes(selected)) {
      selected = null;
      closeSheet();
      map.closePopup();
    }
    // 只畫畫面裡的；太近的合併，最多 CFG.cap 個點。拉到最近還疊在一起就不再合併。
    const bounds = map.getBounds();
    const inView = visible.filter((s) => bounds.contains([s.lat, s.lng]));
    const toPoint = (s) => map.latLngToContainerPoint([s.lat, s.lng]);
    const placed = MapLayers.place(inView, toPoint, { cap: CFG.cap, clusterPx: zoom >= map.getMaxZoom() - 1 ? 0 : CFG.clusterPx });
    // 選到的景點一定畫出來：被畫面上限擠掉就補上；在合併的點裡就拆出來單獨畫，其他的照樣合併
    if (selected && inView.includes(selected) && !placed.groups.some((g) => g.members.includes(selected))) {
      placed.groups.push({ lead: selected, members: [selected] });
      placed.overflow--;
    }
    const groups = [];
    for (const g of placed.groups) {
      if (g.members.length > 1 && g.members.includes(selected)) {
        groups.push({ lead: selected, members: [selected] });
        const rest = g.members.filter((m) => m !== selected);
        groups.push({ lead: rest[0], members: rest });
      } else groups.push(g);
    }
    let drawn = 0;
    for (const g of groups) {
      const s = g.lead;
      drawn += g.members.length;
      const day = dayOf(s);
      const color = SpotView.colorOf(s, dayIndex);
      if (g.members.length > 1) {
        const n = g.members.length;
        const icon = L.divIcon({ className: 'spot', html: `<div class="cluster c-${color}" data-color="${color}">${n}</div>`, iconSize: [40, 40], iconAnchor: [20, 20] });
        L.marker([s.lat, s.lng], { icon, title: `${n} 個景點：點了拉近看`, zIndexOffset: 500 + Z_ORDER[color] })
          .on('click', () => zoomInto(g.members))
          .addTo(layer);
        continue;
      }
      const cls = `marker c-${color}${s.setting === '室內' ? ' indoor' : ''}${day && day.cold ? ' cold' : ''}${s === selected ? ' sel' : ''}`;
      const icon = L.divIcon({
        className: 'spot',
        html: `<div class="${cls}" data-color="${color}"></div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16],
      });
      // title 也寫出結論：不靠顏色、用螢幕報讀也知道會不會下雨
      L.marker([s.lat, s.lng], { icon, title: `${s.name}：${SpotView.verdict(day)}`, zIndexOffset: (s === selected ? 1000 : 0) + Z_ORDER[color] })
        .on('click', () => { selected = s; render(); showDetail(); })
        .addTo(layer);
    }
    // 摘要只算熱門景點（第 1 層），拖動、縮放地圖時不會跟著跳
    const summary = SpotView.summarize(visible.filter((s) => s.layer === 1), dayIndex);
    $('summary').textContent = drive ? DriveTime.summaryText(summary, driveLimit) : SpotView.summaryText(summary);
    const noTime = drive ? shown.filter((s) => s.layer !== 1).length : 0;
    const driveNote = driveFailed ? '車程資料暫時讀不到，請稍後重新整理。'
      : [drive && drive.unreachable ? `有 ${drive.unreachable} 個景點開車到不了（例如離島），沒有列入。` : '',
        noTime ? '車程只算了熱門景點，其他景點選了車程上限時先不顯示。' : ''].filter(Boolean).join('');
    $('driveNote').textContent = driveNote;
    $('driveNote').hidden = !driveNote;
    // 這天沒有灰色的景點，圖例就不用佔一格
    $('legendGray').hidden = summary.gray === 0;
    const marks = groups.length;
    $('info').textContent = `顯示 ${drawn} / ${candidates.length} 個景點` +
      (marks !== drawn ? `（畫面上 ${marks} 個點）` : '') + '。' +
      (placed.overflow ? `還有 ${placed.overflow} 個景點，拉近才看得到。` : '') +
      DayLabels.updatedText(data.generatedAt);
  }

  if (data.source === 'fixture') {
    notice('這是測試用的假資料，不是真的天氣。');
  } else if (DayLabels.isStale(data.days, nowTaipei)) {
    // 資料最後一天比今天還早：太舊
    const last = data.days[data.days.length - 1];
    notice(last ? `這份預報只到 ${SpotView.dateText(last)}，已經過期，請稍後再回來看。` : '目前沒有預報資料，請稍後再回來看。');
  }

  const daysEl = $('days');
  data.days.forEach((d, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = DayLabels.buttonText(d, today);
    b.setAttribute('aria-pressed', String(i === dayIndex));
    b.onclick = () => {
      dayIndex = i;
      [...daysEl.children].forEach((x, j) => x.setAttribute('aria-pressed', String(j === i)));
      render();
      showDetail();
    };
    daysEl.appendChild(b);
  });
  $('hideIndoor').onchange = render;
  $('onlyGood').onchange = render;

  // ---- 出發地和車程 ----
  const option = (value, text) => {
    const o = document.createElement('option');
    o.value = value;
    o.textContent = text;
    return o;
  };
  // 選擇只記在這台瀏覽器，不傳到任何地方。瀏覽器不給存（無痕模式）就算了。
  function saveDrive() {
    try {
      window.localStorage.setItem('driveTime', JSON.stringify({ county: origin && origin.county, town: origin && origin.town, limit: driveLimit }));
    } catch (e) { /* 不能存就不存 */ }
  }
  // 一個縣市一個車程檔，用 <script> 載入（雙擊打開網頁時瀏覽器不讓用 fetch）
  function loadCounty(c) {
    const have = window.DRIVE_TIMES && window.DRIVE_TIMES[c.name];
    if (have) return Promise.resolve(have);
    return new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = 'drive/' + c.file;
      s.onload = () => resolve((window.DRIVE_TIMES || {})[c.name] || null);
      s.onerror = () => resolve(null);
      document.head.appendChild(s);
    });
  }
  function fillTowns(c) {
    $('originTown').replaceChildren(option('', '選鄉鎮'), ...(c ? c.towns.map((t) => option(t, t)) : []));
    $('originTown').value = '';
    $('originTown').disabled = !c;
  }
  function locateNote(text) {
    $('locateNote').textContent = text;
    $('locateNote').hidden = !text;
  }
  let asking = 0; // 連續換出發地時，只認最後一次
  async function setOrigin(county, town) {
    const mine = ++asking;
    const c = driveIndex.counties.find((x) => x.name === county);
    const times = c && c.towns.includes(town) ? await loadCounty(c) : null;
    if (mine !== asking) return;
    // 筆數跟索引對不上（瀏覽器拿到新舊不同版的檔案）也當成讀不到，不要用錯位的車程
    const row = times && times[town] && times[town].length === driveIndex.spots.length ? times[town] : null;
    driveFailed = Boolean(town) && !row;
    origin = row ? { county, town } : null;
    minutesTo = row ? DriveTime.minutesBySpot(driveIndex, row) : null;
    $('driveLimit').disabled = !origin;
    // 讀不到時不存：上次記住的選擇留著，下次打開再試
    if (!driveFailed) saveDrive();
    render();
    showDetail();
  }
  $('trip').hidden = !driveIndex;
  $('driveLimit').disabled = true;
  if (driveIndex) {
    $('originCounty').replaceChildren(option('', '選縣市'), ...driveIndex.counties.map((c) => option(c.name, c.name)));
    $('driveLimit').replaceChildren(option('', '車程不限'), ...DriveTime.LIMITS.map((m) => option(String(m), DriveTime.limitText(m))));
    fillTowns(null);
    $('originCounty').onchange = () => {
      locateNote('');
      fillTowns(driveIndex.counties.find((c) => c.name === $('originCounty').value));
      setOrigin(null, null);
    };
    $('originTown').onchange = () => {
      locateNote('');
      setOrigin($('originCounty').value, $('originTown').value);
    };
    // 用我的位置：手機座標 → 最近的鄉鎮 → 跟自己選一樣走 setOrigin。
    // 座標只在這裡用來找鄉鎮，不存、不傳出去；記住的只有鄉鎮。
    const geo = window.navigator && window.navigator.geolocation;
    $('useLocation').hidden = !geo;
    $('useLocation').onclick = () => {
      $('useLocation').disabled = true;
      locateNote('正在取得你的位置…');
      geo.getCurrentPosition((pos) => {
        $('useLocation').disabled = false;
        const near = DriveTime.nearestTown(driveIndex, pos.coords.latitude, pos.coords.longitude);
        if (!near) return locateNote('你的位置離台灣的鄉鎮太遠，請手動選出發地。');
        $('originCounty').value = near.county;
        fillTowns(driveIndex.counties.find((c) => c.name === near.county));
        $('originTown').value = near.town;
        setOrigin(near.county, near.town);
        locateNote(`用你的位置：最近的鄉鎮是${near.county}${near.town}，車程從這個鄉鎮算。`);
      }, (err) => {
        $('useLocation').disabled = false;
        locateNote(err && err.code === 1
          ? '沒有拿到位置權限。要用的話請在瀏覽器設定允許這個網站取得位置，或手動選出發地。'
          : '暫時拿不到你的位置，請稍後再試，或手動選出發地。');
      }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 });
    };
    $('driveLimit').onchange = () => {
      driveLimit = $('driveLimit').value ? Number($('driveLimit').value) : null;
      saveDrive();
      render();
    };
  }
  $('sheetClose').onclick = () => { closeSheet(); unselect(); };
  map.on('popupclose', unselect);
  // 拖動、縮放地圖：重新決定畫哪些點（層、畫面上限、合併）
  map.on('moveend', () => render());
  // 手機轉向或視窗拉寬拉窄：景點資訊換到對的位置，圖例說明照新的寬度開或收
  mq.addEventListener('change', () => { $('more').open = !narrow(); showDetail(); });
  // 地圖放大，標記跟著變大，比較好點
  map.on('zoomend', () => {
    const z = map.getZoom();
    document.documentElement.style.setProperty('--dot', (z >= 11 ? 22 : z >= 9.5 ? 18 : 14) + 'px');
  });

  render();
  // 上次選的出發地和車程還在就直接套用
  if (driveIndex) {
    let saved = null;
    try { saved = JSON.parse(window.localStorage.getItem('driveTime')); } catch (e) { /* 讀不到就當沒選過 */ }
    const c = saved && driveIndex.counties.find((x) => x.name === saved.county);
    if (c && c.towns.includes(saved.town)) {
      // 把選單設回上次的值，再走選單自己的流程（跟使用者自己選的一樣）
      if (DriveTime.LIMITS.includes(saved.limit)) {
        driveLimit = saved.limit;
        $('driveLimit').value = String(saved.limit);
      }
      $('originCounty').value = c.name;
      fillTowns(c);
      $('originTown').value = saved.town;
      $('originTown').onchange();
    }
  }
  // 一開始把台灣本島和澎湖放進沒被面板擋住的範圍
  const panel = daysEl.parentNode;
  map.fitBounds([[21.85, 119.4], [25.35, 122.05]], {
    paddingTopLeft: narrow() ? [8, panel.offsetHeight + 8] : [panel.offsetWidth + 16, 8],
    paddingBottomRight: [8, 28],
  });
})();
</script>
</body>
</html>
